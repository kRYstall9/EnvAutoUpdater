name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  test:
    name: E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run Unit & Integration Tests
        run: dotnet test tests/EnvAutoUpdater.Tests/EnvAutoUpdater.Tests.csproj --no-build --configuration Release --verbosity normal

      - name: Build Docker image (E2E validation)
        run: docker build -t envautoupdater:e2e-test .

      - name: Run E2E smoke test
        run: |
          # Create a minimal config for E2E validation
          mkdir -p /tmp/e2e-test
          cat > /tmp/e2e-test/config.json <<EOF
          {
            "services": [],
            "checkInterval": 5,
            "logLevel": "info"
          }
          EOF

          # Run the container with a timeout to verify it starts and runs correctly
          timeout 15 docker run --rm \
            -v /tmp/e2e-test/config.json:/app/config.json:ro \
            envautoupdater:e2e-test || EXIT_CODE=$?

          # Exit code 124 means timeout killed it (expected, the app runs indefinitely)
          # Exit code 0 means it exited gracefully
          if [ "${EXIT_CODE:-0}" -eq 124 ] || [ "${EXIT_CODE:-0}" -eq 0 ]; then
            echo "E2E smoke test passed: container started and ran successfully"
          else
            echo "E2E smoke test failed with exit code: ${EXIT_CODE}"
            exit 1
          fi

  release:
    name: Semantic Release & Docker Push
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install semantic-release plugins
        run: npm ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: npx semantic-release
